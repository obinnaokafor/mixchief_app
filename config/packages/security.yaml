security:
    enable_authenticator_manager: true
    password_hashers:
        App\Entity\Users:
            algorithm: 'auto'
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'auto'
            cost:      15

    # password_hashers:
    #     Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\Users
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

            # activate different ways to authenticate

            # http_basic: true
            # https://symfony.com/doc/current/security.html#a-configuring-how-your-users-will-authenticate

            # form_login: true
            # https://symfony.com/doc/current/security/form_login_setup.html

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/login, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/register, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/email/*, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/password/*, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/checkout, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/order/*, roles: IS_AUTHENTICATED_ANONYMOUSLY }
        - { path: ^/payment/*, roles: ROLE_USER }
        - { path: ^/admin/*, roles: ROLE_USER }
        - { path: ^/pos/*, roles: ROLE_USER }
        - { path: ^/, roles: IS_AUTHENTICATED_ANONYMOUSLY }

        # - { path: ^/profile, roles: ROLE_USER }
