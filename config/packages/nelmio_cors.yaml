nelmio_cors:
    defaults:
        allow_origin: []  # Allows all origins, effectively disabling CORS
        allow_headers: ['*']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        max_age: 3600
        allow_credentials: false
    paths:
        '^/api': # Apply CORS settings to all routes
            allow_origin: ['http://localhost:3000']  # Allows all origins, effectively disabling CORS
