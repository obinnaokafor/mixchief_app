version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./public:/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://admin:remember@db:3306/amply?serverVersion=8.0

  db:
    image: mysql:8.0
    platform: linux/x86_64  # Added platform specification
    ports:
      - "4307:3306"
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: amply
      MYSQL_USER: admin
      MYSQL_PASSWORD: remember
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "admin", "-premember"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data: